services:
  elinksnet:
    container_name: elinksnet
    image: elinksteam/elinksnet:8.0.0
    build:
      context: .
    restart: unless-stopped
    ports:
      - "18966:18966"
    environment:
      GROQ_API_KEY: ""
      ELINKS_AI_MODEL: "llama-3.3-70b-versatile"
      IPINFO_API_TOKEN: ""
      IPAPIIS_API_KEY: ""
      IP2LOCATION_API_KEY: ""
